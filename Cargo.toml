[package]
name = "runact"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A Rust-native actor runtime with BEAM-style processes"
repository = "https://github.com/runact/runact"
keywords = ["actor", "runtime", "concurrency", "supervision", "beam"]
categories = ["asynchronous", "concurrency"]
readme = "README.md"

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "runact_bench"
harness = false
